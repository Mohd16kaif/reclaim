workflows:
  ios-distribution:
    name: iOS TestFlight Distribution
    max_build_duration: 60
    environment:
      groups:
        - reclaim
      ios_signing:
        provisioning_profiles:
          - reclaim_app_store
          - reclaim_device_activity
          - reclaim_shield_config
          - reclaim_panic_timer_widget
      vars:
        XCODE_WORKSPACE: "ios/reclaimapp.xcworkspace"
        XCODE_SCHEME: "reclaimapp"
      node: latest
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Create .env file
        script: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          echo "EXPO_PUBLIC_GROQ_API_KEY=$EXPO_PUBLIC_GROQ_API_KEY" >> .env
          echo "EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY" >> .env
          echo "EXPO_PUBLIC_SUPERWALL_API_KEY_IOS=$EXPO_PUBLIC_SUPERWALL_API_KEY_IOS" >> .env
      - name: Install npm dependencies
        script: npm install
      - name: Patch RCTPlatformColorUtils designated initializers
        script: |
          set -e
          FILE="node_modules/react-native/ReactCommon/react/renderer/graphics/platform/ios/react/renderer/graphics/RCTPlatformColorUtils.mm"
          if [ -f "$FILE" ]; then
            sed -i '' 's/return {(float)rgba\[0\], (float)rgba\[1\], (float)rgba\[2\], (float)rgba\[3\]};/return {.red = (float)rgba[0], .green = (float)rgba[1], .blue = (float)rgba[2], .alpha = (float)rgba[3]};/' "$FILE"
            echo "Patched RCTPlatformColorUtils.mm"
            grep -A1 "_ColorComponentsFromUIColor(UIColor \*color)" "$FILE"
          else
            echo "WARNING: RCTPlatformColorUtils.mm not found at expected path"
          fi
      - name: Install CocoaPods
        script: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
      - name: Commit updated Podfile.lock
        script: |
          set -e
          cd ios
          if git diff --quiet Podfile.lock; then
            echo "Podfile.lock unchanged"
          else
            git config user.email "codemagic@ci.local"
            git config user.name "Codemagic CI"
            git add Podfile.lock
            git commit -m "chore: update Podfile.lock [skip ci]"
            if ! git push; then
              echo "Warning: Failed to push Podfile.lock (permission issue?)"
            fi
          fi
      - name: Set Xcode project to manual signing
        script: |
          xcode-project use-profiles
      - name: Debug Pods build errors
        script: |
          set +e
          echo "===== Isolated build of React-graphics target with full verbosity ====="
          xcodebuild -project ios/Pods/Pods.xcodeproj \
            -target React-graphics \
            -configuration Release \
            -sdk iphoneos \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -verbose \
            build 2>&1 | tee /tmp/graphics_debug.log
          echo "===== EXIT CODE: $? ====="
          echo "===== Searching for error/crash/fatal lines ====="
          grep -n -i "error:\|fatal\|crash\|Segmentation\|internal error\|Stack dump\|PLEASE submit a bug report" /tmp/graphics_debug.log || echo "no matches found"
          echo "===== Checking for clang crash logs ====="
          find ~/Library/Logs/DiagnosticReports -name "*.crash" -newer /tmp/graphics_debug.log 2>/dev/null | while read f; do
            echo "--- CRASH LOG: $f ---"
            cat "$f"
          done
          echo "===== Last 100 lines of full log for context ====="
          tail -n 100 /tmp/graphics_debug.log
          echo "===== END DEBUG ====="
          set -e
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-jobs 2"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true