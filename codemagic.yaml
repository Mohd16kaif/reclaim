workflows:
  ios-distribution:
    name: iOS TestFlight Distribution
    max_build_duration: 60
    environment:
      groups:
        - reclaim
      ios_signing:
        provisioning_profiles:
          - reclaim_app_store
          - reclaim_device_activity
          - reclaim_shield_config
          - reclaim_panic_timer_widget
      vars:
        XCODE_WORKSPACE: "ios/reclaimapp.xcworkspace"
        XCODE_SCHEME: "reclaimapp"
      node: latest
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Create .env file
        script: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          echo "EXPO_PUBLIC_GROQ_API_KEY=$EXPO_PUBLIC_GROQ_API_KEY" >> .env
          echo "EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY" >> .env
          echo "EXPO_PUBLIC_SUPERWALL_API_KEY_IOS=$EXPO_PUBLIC_SUPERWALL_API_KEY_IOS" >> .env
      - name: Install npm dependencies
        script: npm install
      - name: Install CocoaPods
        script: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
      - name: Commit updated Podfile.lock
        script: |
          set -e
          cd ios
          if git diff --quiet Podfile.lock; then
            echo "Podfile.lock unchanged"
          else
            git config user.email "codemagic@ci.local"
            git config user.name "Codemagic CI"
            git add Podfile.lock
            git commit -m "chore: update Podfile.lock [skip ci]"
            if ! git push; then
              echo "Warning: Failed to push Podfile.lock (permission issue?)"
            fi
          fi
      - name: Set Xcode project to manual signing
        script: |
          xcode-project use-profiles
      - name: Debug Pods build errors
        script: |
          set +e
          xcodebuild -project ios/Pods/Pods.xcodeproj \
            -target libdav1d \
            -target glog \
            -target Sentry \
            -configuration Release \
            -sdk iphoneos \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee /tmp/pods_debug.log
          echo "===== ALL error: LINES ====="
          grep -n "error:" /tmp/pods_debug.log || echo "no error: lines found"
          echo "===== END DEBUG ====="
          set -e
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true